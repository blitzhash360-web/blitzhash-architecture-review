name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Demo (fake app) produces a full report
        run: |
          node bin/arch-review.mjs demo --out demo-review.md
          grep -q "## Scorecard" demo-review.md
          grep -q "## Prioritized fixes" demo-review.md
      - name: Well-built fixture passes a CI gate
        run: node bin/arch-review.mjs test/fixtures/solid-app --no-git --fail-under 90
      - name: Install skill dry run writes nothing
        run: |
          d="$(mktemp -d)"
          node bin/arch-review.mjs install-skill --target all "$d" | grep -q "Dry run: nothing was written"
          test -z "$(ls -A "$d")"
